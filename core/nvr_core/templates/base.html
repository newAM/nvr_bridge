<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}nvr_bridge{% endblock %}</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <header>
      <a class="brand" href="{{ url_for('web.index') }}">nvr_bridge</a>
      {% if user %}
      <nav class="header-nav">
        <a href="{{ url_for('web.events') }}">Events</a>
        <form method="POST" action="{{ url_for('auth.logout') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
          <button type="submit" class="btn-link">Sign out</button>
        </form>
      </nav>
      {% else %}
      <nav class="header-nav">
        <a href="{{ url_for('auth.login') }}">Sign in</a>
      </nav>
      {% endif %}
    </header>
    <hr />
    {% block content %}{% endblock %}
    <hr />
    <footer>
      Powered by
      <a href="https://github.com/newAM/nvr_bridge">nvr_bridge</a>, licensed
      under the <a href="https://spdx.org/licenses/MIT.html">MIT</a> license.
    </footer>
  </body>
</html>
